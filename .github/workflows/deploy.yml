# Автоматический деплой на Vercel

name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Проверка кода
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint
        continue-on-error: true

  # Сборка проекта
  build:
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_WORDPRESS_API_URL: ${{ secrets.WORDPRESS_API_URL }}
          NEXT_PUBLIC_WORDPRESS_ACF_URL: ${{ secrets.WORDPRESS_ACF_URL }}

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: .next/
          retention-days: 7

  # Уведомление об успехе
  notify:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    
    steps:
      - name: Success notification
        run: |
          echo "✅ Проект успешно собран и готов к деплою!"
          echo "🚀 Vercel автоматически задеплоит изменения"
